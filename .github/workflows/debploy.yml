# Workflow name displayed in GitHub Actions
name: Next.js CI/CD

# Run on pushes to main or manual execution
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required to publish the Docker image
permissions:
  contents: read
  packages: write

jobs:
  # Build the application and publish its Docker image
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository source code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Authenticate with GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and publish the Next.js Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true

          # Pass public API configuration during the build
          build-args: |
            NEXT_PUBLIC_API_MODE=python
            NEXT_PUBLIC_API_URL=https://test.zahrat-manisa.ly/

          # Publish a stable tag and a commit-specific tag
          tags: |
            ghcr.io/zahrat-manisa-ly/admin-dashboard:latest
            ghcr.io/zahrat-manisa-ly/admin-dashboard:${{ github.sha }}

  # Deploy the published image to the server
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Connect to the server through SSH and update admin-website only
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN

          script: |
            set -eu

            cd /home/traveler/admin-dashboard

            # Authenticate Docker to pull the private image
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              -u AbdoElosta03 --password-stdin

            # Pull the new image and update only admin-website
            docker compose pull admin-website
            docker compose up -d --no-deps admin-website

            # Log out from GHCR after deployment
            docker logout ghcr.io