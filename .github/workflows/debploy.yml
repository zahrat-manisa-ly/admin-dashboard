
# Workflow name displayed in GitHub Actions
name: Next.js CI/CD

# Define when the workflow should run
on:
  # Run automatically when changes are pushed to main
  push:
    branches:
      - main

  # Allow manual execution from the Actions tab
  workflow_dispatch:

# Define permissions for repository access and package publishing
permissions:
  contents: read
  packages: write

# Define the jobs executed by GitHub Actions
jobs:
  build:
    # Use a GitHub-hosted Ubuntu runner
    runs-on: ubuntu-latest

    # Execute the workflow steps sequentially
    steps:
      # Download the repository source code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Authenticate with GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image and push it to GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          # Use the repository root as the Docker build context
          context: .

          # Publish the image to GitHub Container Registry
          push: true

          # Create a stable tag and a unique tag for this commit
          tags: |
            ghcr.io/zahrat-manisa-ly/admin-dashboard:latest
            ghcr.io/zahrat-manisa-ly/admin-dashboard:${{ github.sha }}
